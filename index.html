<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅のしおり</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=M+PLUS+Rounded+1c:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

.bottom-nav {
    padding-bottom: env(safe-area-inset-bottom);
}
        body { 
    font-family: 'M PLUS Rounded 1c',"Noto Sans TC", "Noto Sans JP", sans-serif;
    font-weight: 400;
    line-height: 1.6;

    background-color: #EFECE6;
    color: #2D2B28;
    -webkit-tap-highlight-color: transparent;
}
        .editorial-title {
            font-family: "M PLUS Rounded 1c", "Noto Sans TC", "Noto Sans JP", sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-btn {
            margin-left: auto;
            white-space: nowrap;
        }
        button, a, input, select, textarea {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        button:focus, button:active {
            outline: none;
            box-shadow: none;
        }
        .summary-title {
            font-size: 12px;
            color: #8A867D;
        }
        .overview-summary-location {
            font-size: 12px;
            font-weight: 500;
            color: #2D2B28;
            margin-top: 2px;
        }

/* Bottom Navigation Active Effect */

.nav-active {
    color: #2D2B28 !important;
}

.nav-active i {
    transform: translateY(-3px);
}

.nav-active::before {
    content: "";
    position: absolute;
    top: -6px;
    width: 38px;
    height: 38px;
    background: #EFECE6;
    border-radius: 50%;
    z-index: -1;
}

.nav-item {
    position: relative;
    transition: all .25s ease;
}

.nav-item i {
    transition: transform .25s ease;
}

    </style>
</head>
<body class="bg-[#EFECE6] min-h-screen flex justify-center text-[#2D2B28]">

    <div id="app" class="w-full max-w-md bg-[#F9F8F5] min-h-screen shadow-2xl flex flex-col relative pb-32 border-x border-[#E5E2D9]">
        
        <header class="sticky top-0 z-40 bg-[#F9F8F5]/95 backdrop-blur-md border-b border-[#E5E2D9] px-6 py-4 flex justify-between items-center">
            <div>
                <span id="headerSubTitle" class="text-[10px] tracking-widest text-[#8A867D] uppercase font-medium">Tokyo 5-Days Trip</span>
                <h1 id="tripTitle" class="text-base font-bold text-[#2D2B28] editorial-title">東京自由行</h1>
            </div>

            <button id="prepAddBtn"
                onclick="openPrepModal('prep', appData.prepCategories[0].category)"
                class="hidden text-xs bg-[#2D2B28] text-[#F9F8F5] px-3 py-1.5 uppercase tracking-wider font-medium">
                <i class="fa-solid fa-plus mr-1"></i>
                新增待辦
            </button>

            <button id="expenseAddBtn"
                onclick="openModal('expenseModal')"
                class="hidden text-xs bg-[#2D2B28] text-[#F9F8F5] px-3 py-1.5 uppercase tracking-wider font-medium">
                <i class="fa-solid fa-plus mr-1"></i>
                新增支出
            </button>
        </header>

        <div id="dateTabBar" class="bg-[#F3F1EA] border-b border-[#E5E2D9] px-4 py-2.5 gap-2 overflow-x-auto hide-scrollbar sticky top-[65px] z-30 hidden items-center">
        </div>

        <main class="flex-1 p-5 space-y-6" id="mainContentArea">
        </main>

        <nav class="bottom-nav fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#F9F8F5]/95 backdrop-blur-md border-t border-[#E5E2D9] py-3 px-4 flex justify-around items-center z-40 shadow-2xl">        <button onclick="switchTab('overview')" id="nav-btn-overview" class="nav-item flex flex-col items-center text-[#2D2B28] font-bold p-1.5 transition focus:outline-none">                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] tracking-widest uppercase">總覽</span>
            </button>
            <button onclick="switchTab('prep')" id="nav-btn-prep" class=" nav-item flex flex-col items-center text-[#8A867D] p-1.5 transition focus:outline-none">
                <i class="fa-solid fa-suitcase-rolling text-lg mb-1"></i>
                <span class="text-[10px] tracking-widest uppercase">準備</span>
            </button>
            <button onclick="switchTab('hotel')" id="nav-btn-hotel" class=" nav-item flex flex-col items-center text-[#8A867D] p-1.5 transition focus:outline-none">
                <i class="fa-solid fa-hotel text-lg mb-1"></i>
                <span class="text-[10px] tracking-widest uppercase">住宿</span>
            </button>
            <button onclick="switchTab('itinerary')" id="nav-btn-itinerary" class=" nav-item flex flex-col items-center text-[#8A867D] p-1.5 transition focus:outline-none">
                <i class="fa-solid fa-map-location-dot text-lg mb-1"></i>
                <span class="text-[10px] tracking-widest uppercase">行程</span>
            </button>
            <button onclick="switchTab('bills')" id="nav-btn-bills" class=" nav-item flex flex-col items-center text-[#8A867D] p-1.5 transition focus:outline-none">
                <i class="fa-solid fa-wallet text-lg mb-1"></i>
                <span class="text-[10px] tracking-widest uppercase">分帳</span>
            </button>
        </nav>

        <div id="spotDetailModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-[#F9F8F5] border border-[#E5E2D9] w-full max-w-sm rounded-none p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-[#E5E2D9] pb-3">
                    <h3 id="spotModalTitle" class="font-bold text-sm text-[#2D2B28] editorial-title">景點周邊詳情</h3>
                    <button onclick="closeModal('spotDetailModal')" class="text-[#8A867D] text-lg p-1 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="bg-[#F3F1EA] p-3 border border-[#E5E2D9] space-y-2 text-xs">
                   <div id="subPlaceFormTitle" class="font-bold text-[#2D2B28]">新增周邊店家</div>
                    <form onsubmit="handleAddSpotSubPlace(event)" class="space-y-2">
                     <input type="hidden" id="editingSubPlaceId">
                        <select id="subCat" class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                            <option value="餐廳">餐廳</option>
                            <option value="購物">購物</option>
                            <option value="咖啡">咖啡</option>
                            <option value="甜點">甜點</option>
                            <option value="麵包">麵包</option>
                        </select>
                        <input type="text" id="subName" placeholder="店名" required class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                        <input type="text" id="subSubtitle" placeholder="特色介紹（例：東京知名雞白湯拉麵）"class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                        <input type="text" id="subHours" placeholder="營業時間 (例: 10:00 - 20:00)" class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                        <input type="text" id="subClosed" placeholder="公休日 (例: 週三)" class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                        <input type="text"id="subNote" placeholder="備註（例：需排隊、建議預約）"class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                        <textarea id="subMenuList"placeholder="推薦品項（每行一個）"rows="3"class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]"></textarea>
                        <input type="url" id="subUrl" placeholder="Google 導航連結" class="w-full bg-[#F9F8F5] border border-[#E5E2D9] p-2 text-xs text-[#2D2B28]">
                        <button id="subPlaceSubmitBtn" type="submit"class="w-full bg-[#2D2B28] text-[#F9F8F5] py-2 text-xs uppercase font-medium focus:outline-none"> 新增至清單</button>
                    </form>
                </div>

                <div id="spotSubPlacesList" class="space-y-3 text-xs text-[#5A574E] max-h-[40vh] overflow-y-auto">
                </div>

                <button onclick="closeModal('spotDetailModal')" class="w-full bg-[#E5E2D9] text-[#2D2B28] py-2.5 text-xs uppercase tracking-wider focus:outline-none">關閉視窗</button>
            </div>
        </div>

        <div id="foodBlogModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-[#F9F8F5] border border-[#E5E2D9] w-full max-w-sm rounded-none p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-[#E5E2D9] pb-3">
                    <h3 id="blogTitle" class="font-bold text-sm text-[#2D2B28] editorial-title">店家情報</h3>
                    <button onclick="closeModal('foodBlogModal')" class="text-[#8A867D] text-lg p-1 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="blogContent" class="space-y-3 text-xs text-[#5A574E]"></div>
                <button onclick="closeModal('foodBlogModal')" class="w-full bg-[#2D2B28] text-[#F9F8F5] py-2.5 font-medium text-xs tracking-wider uppercase transition focus:outline-none">關閉視窗</button>
            </div>
        </div>

        <div id="hotelPlaceModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-[#F9F8F5] border-t border-[#E5E2D9] w-full max-w-md rounded-none p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4 border-b border-[#E5E2D9] pb-3">
                    <h3 class="font-bold text-[15px] text-[#2D2B28] editorial-title">新增住宿周邊地點</h3>
                    <button onclick="closeModal('hotelPlaceModal')" class="text-[#8A867D] text-lg p-2 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="hotelPlaceForm" onsubmit="handleSaveHotelPlace(event)" class="space-y-4 text-xs">
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">選擇分類</label>
                        <select id="hpCatSelect" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">店名 / 地點名稱</label>
                        <input type="text" id="hpName" placeholder="例如: 7-11 新大塚站前店" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">營業時間</label>
                        <input type="text" id="hpHours" placeholder="24小時營業" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">Google 地圖連結</label>
                        <input type="url" id="hpUrl" placeholder="https://maps.app.goo.gl/..." required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">備註</label>
                        <input type="text" id="hpNote" placeholder="例如: 𖤐必吃招牌" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <button type="submit" class="w-full bg-[#2D2B28] text-[#F9F8F5] py-3.5 font-medium text-xs tracking-widest uppercase transition focus:outline-none">確認新增</button>
                </form>
            </div>
        </div>

        <div id="editHotelPlaceModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-[#F9F8F5] border-t border-[#E5E2D9] w-full max-w-md rounded-none p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4 border-b border-[#E5E2D9] pb-3">
                    <h3 class="font-bold text-sm text-[#2D2B28] editorial-title">編輯住宿周邊地點</h3>
                    <button onclick="closeModal('editHotelPlaceModal')" class="text-[#8A867D] text-lg p-2 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="editHotelPlaceForm" onsubmit="handleUpdateHotelPlace(event)" class="space-y-4 text-xs">
                    <input type="hidden" id="editHpId">
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">選擇分類</label>
                        <select id="editHpCatSelect" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">店名 / 地點名稱</label>
                        <input type="text" id="editHpName" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">營業時間</label>
                        <input type="text" id="editHpHours" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">Google 地圖連結</label>
                        <input type="url" id="editHpUrl" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">備註</label>
                        <input type="text" id="editHpNote" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="deleteCurrentHotelPlace()" class="w-1/3 bg-rose-50 text-rose-700 border border-rose-200 py-3 text-xs uppercase focus:outline-none">刪除</button>
                        <button type="submit" class="w-2/3 bg-[#2D2B28] text-[#F9F8F5] py-3 text-xs tracking-widest uppercase font-medium focus:outline-none">儲存修改</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-[#F9F8F5] border-t border-[#E5E2D9] w-full max-w-md rounded-none p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4 border-b border-[#E5E2D9] pb-3">
                    <h3 class="font-bold text-sm text-[#2D2B28] editorial-title">新增行程項目</h3>
                    <button onclick="closeModal('addModal')" class="text-[#8A867D] text-lg p-2 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="addForm" onsubmit="handleAddItem(event)" class="space-y-4 text-xs">
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">選擇天數</label>
                        <select id="inputDay" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                            <option value="1">Day 1 (9/9 三)</option>
                            <option value="2">Day 2 (9/10 四)</option>
                            <option value="3">Day 3 (9/11 五)</option>
                            <option value="4">Day 4 (9/12 六)</option>
                            <option value="5">Day 5 (9/13 日)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">項目分類</label>
                        <select id="inputType" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                            <option value="attraction">景點 (Attraction)</option>
                            <option value="restaurant">餐廳 (Restaurant)</option>
                            <option value="shopping">購物 (Shopping)</option>
                            <option value="transport">交通 (Transport)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">時間</label>
                            <input type="text" id="inputTime" placeholder="例: 09:30" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                        </div>
                        <div>
                            <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">地點名稱</label>
                            <input type="text" id="inputLocation" placeholder="例: 淺草寺" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">Google 地圖連結</label>
                        <input type="url" id="inputUrl" placeholder="https://..." class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">行程內容與關鍵字</label>
                        <textarea id="inputDesc" rows="3" placeholder="必吃美食: ..." class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#2D2B28] text-[#F9F8F5] py-3.5 font-medium text-xs tracking-widest uppercase transition focus:outline-none">確認新增</button>
                </form>
            </div>
        </div>

        <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-[#F9F8F5] border-t border-[#E5E2D9] w-full max-w-md rounded-none p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4 border-b border-[#E5E2D9] pb-3">
                    <h3 class="font-bold text-sm text-[#2D2B28] editorial-title">編輯行程項目</h3>
                    <button onclick="closeModal('editModal')" class="text-[#8A867D] text-lg p-2 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="editForm" onsubmit="handleUpdateItem(event)" class="space-y-4 text-xs">
                    <input type="hidden" id="editItemId">
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">調整天數</label>
                        <select id="editInputDay" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                            <option value="1">Day 1 (9/9 三)</option>
                            <option value="2">Day 2 (9/10 四)</option>
                            <option value="3">Day 3 (9/11 五)</option>
                            <option value="4">Day 4 (9/12 六)</option>
                            <option value="5">Day 5 (9/13 日)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">項目分類</label>
                        <select id="editInputType" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                            <option value="attraction">景點</option>
                            <option value="restaurant">餐廳</option>
                            <option value="shopping">購物</option>
                            <option value="transport">交通</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">時間</label>
                            <input type="text" id="editInputTime" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                        </div>
                        <div>
                            <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">地點名稱</label>
                            <input type="text" id="editInputLocation" required class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#8A867D] mb-1 uppercase tracking-wider">Google 地圖連結</label>
                        <input type="url" id="editInputUrl" class="w-full bg-[#F3F1EA] border border-[#E5E2D9] rounded-none p-3 text-xs text-[#2D2B28]">
                    </div>

        async function loadItineraryFromSheet() {
            try {
                const response = await fetch(API_URL + "?sheet=Itinerary");
                const data = await response.json();
                data.forEach(item => {
                    const day = appData.days.find(d => d.day === Number(item.day));
                    if(day) {
                        const existingIndex = day.items.findIndex(i => i.id == item.id);
                        const newItem = {
                            id: Number(item.id),
                            type: item.type,
                            time: item.time,
                            title: item.title,
                            url: item.url,
                            desc: item.desc,
                            subPlaces: item.subPlaces || []
                        };
                        if(existingIndex > -1) {
                            day.items[existingIndex] = newItem;
                        } else {
                            day.items.push(newItem);
                        }
                    }
                });
                saveAppData();
                render();
                showSyncMessage("行程同步完成");
            } catch(error) {
                console.error("行程同步失敗:", error);
            }
        }

                    item.day = Number(item.day);

            const select = document.getElementById('prepCatSelect');
            select.innerHTML = '';

            if(type === 'prep') {

                appData.prepCategories.forEach(cat => {

                    opt.value = cat.category; opt.innerText = cat.category;

                    select.appendChild(opt);

            e.preventDefault();
            const type = document.getElementById('prepType').value;
            const targetCategory = document.getElementById('prepCatSelect').value;
            const text = document.getElementById('prepItemText').value;
            if(!text) return;

            if(type === 'prep') {
                const cat = appData.prepCategories.find(c => c.category === targetCategory);
                if(cat) cat.items.push({ id: Date.now(), text, done: false });
            } else {
                const cat = appData.luggageCategories.find(c => c.category === targetCategory);
                if(cat) cat.items.push({ text, done: false });
            }
            saveAppData();
            closeModal('prepModal');
            render();

        async function handleAddSpotSubPlace(e) {
    e.preventDefault();

   const category = document.getElementById('subCat').value;
   const name = document.getElementById('subName').value;
   const subtitle = document.getElementById('subSubtitle').value;
   const hours = document.getElementById('subHours').value;
   const closed = document.getElementById('subClosed').value;
   const note = document.getElementById('subNote').value;
   const menuList = document.getElementById('subMenuList').value
        .split('\n')
        .filter(x => x.trim() !== '');
   const url = document.getElementById('subUrl').value.trim();


    const day = appData.days.find(
        d => d.day === currentSpotContext.dayNum
    );

    const item = day.items.find(
        i => i.id === currentSpotContext.itemId
    );


    if(!item.subPlaces) {
        item.subPlaces = [];
    }


    // 編輯模式
    if(editingSpotSubPlace){

        const target = item.subPlaces.find(
            sp => sp.id === editingSpotSubPlace
        );


        if(target){
    target.category = category;
    target.name = name;
    target.subtitle = document.getElementById('subSubtitle').value;
    target.hours = hours;
    target.closed = closed;       
    target.note = document.getElementById('subNote').value;

    target.menuList = document.getElementById('subMenuList').value
        .split('\n')
        .filter(x => x.trim() !== '');

    target.url = url;

    console.log("更新後closed:", target.closed);
}


    } 
    // 新增模式
    else {

        item.subPlaces.push({
    id: Date.now(),
    category,
    name,
    subtitle: document.getElementById('subSubtitle').value,
    hours,
    closed,
    note: document.getElementById('subNote').value,
    menuList: document.getElementById('subMenuList').value
        .split('\n')
        .filter(x => x.trim() !== ''),
    url
});

    }


    saveAppData();
    await updateItineraryToSheet(
       item,
       currentSpotContext.dayNum
     );
    renderSpotSubPlacesList();
    render();


    // 重置回新增模式
    editingSpotSubPlace = null;


    document.getElementById('subPlaceFormTitle').innerText =
        '新增周邊店家';

    document.getElementById('subPlaceSubmitBtn').innerText =
        '新增至清單';


   document.getElementById('subSubtitle').value = '';
   document.getElementById('subNote').value = '';
   document.getElementById('subMenuList').value = '';

   // 新增/更新完成後關閉周邊資訊視窗
   closeModal('spotDetailModal');

}

    async function deleteSpotSubPlace(itemId, subId) {

    if(confirm('確定要刪除這個周邊店家嗎？')) {

        const day = appData.days.find(
            d => d.day === currentSpotContext.dayNum
        );

        const item = day.items.find(
            i => i.id === itemId
        );


        if(item && item.subPlaces) {

            item.subPlaces = item.subPlaces.filter(
                sp => sp.id !== subId
            );


            saveAppData();
            await updateItineraryToSheet(
            item,
            currentSpotContext.dayNum
            );
            render();

        }
    }
}

        function renderBills(container) {
            let totalTWD = 0;
            let totalJPY = 0;
            const defaultMembers = ['彩庭', '溫芯', '俞萱', '浤緯'];
            let netBalances = { '彩庭': 0, '溫芯': 0, '俞萱': 0, '浤緯': 0 };

            appData.expenses.forEach(ex => {
                const members = ex.members || defaultMembers;
                const amountTWD = ex.currency === 'JPY' ? ex.amount * JPY_EXCHANGE_RATE : ex.amount;
                totalTWD += amountTWD;
                if(ex.currency === 'JPY') totalJPY += ex.amount;

                if(!ex.repayments) {
                    ex.repayments = {};
                    members.forEach(m => { if(m !== ex.payer) ex.repayments[m] = false; });
                }

                const sharePerPerson = amountTWD / members.length;
                netBalances[ex.payer] += (amountTWD - sharePerPerson);
                members.forEach(m => {
                    if(m !== ex.payer) {
                        if(ex.repayments[m]) netBalances[ex.payer] -= sharePerPerson;
                        else netBalances[m] -= sharePerPerson;
                    }
                });
            });

            const formattedRate = JPY_EXCHANGE_RATE.toFixed(2);

            const sortedExpenses = [...appData.expenses].sort((a, b) => {
                const membersA = a.members || defaultMembers;
                const needPayA = membersA.filter(m => m !== a.payer);
                const isAllRepaidA = needPayA.length > 0 && needPayA.every(m => a.repayments && a.repayments[m]);

                const membersB = b.members || defaultMembers;
                const needPayB = membersB.filter(m => m !== b.payer);
                const isAllRepaidB = needPayB.length > 0 && needPayB.every(m => b.repayments && b.repayments[m]);

                if (isAllRepaidA !== isAllRepaidB) {
                    return isAllRepaidA ? 1 : -1;
                }

                const dateA = a.date || '';
                const dateB = b.date || '';
                return dateA.localeCompare(dateB);
            });

                                <span class="text-[10px] text-[#8A867D]">日圓總支出</span>

                    </div>

                    <div class="bg-[#F3F1EA] border border-[#E5E2D9] p-4 space-y-3">
                        <span class="text-[10px] uppercase tracking-widest text-[#8A867D] block">Member Balances</span>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            ${defaultMembers.map(name => {
                                const net = Math.round(netBalances[name]);
                                const isPos = net > 5, isNeg = net < -5;
                                return `
                                    <div class="bg-[#F9F8F5] p-3 border border-[#E5E2D9]">
                                        <div class="font-bold text-[#2D2B28]">${name}</div>
                                        <div class="font-bold mt-1 ${isPos ? 'text-emerald-600' : isNeg ? 'text-rose-600' : 'text-[#8A867D]'}">
                                            ${!isPos && !isNeg ? '已結清 ±$0' : (isPos ? '可拿回 +' : '需支付 -') + 'NT$' + Math.abs(net).toLocaleString()}
                                        </div>

                        </div>

                                <i class="fa-solid fa-rotate-right text-[10px]"></i> 同步
                            </button>

                        <div class="space-y-2 text-xs">
                            ${sortedExpenses.length === 0 ? '<div class="text-center py-6 text-[#8A867D]">尚無分帳紀錄</div>' : sortedExpenses.map(ex => {

        async function addItineraryToSheet(item, dayNum) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "addItinerary",
                        id: item.id,
                        day: dayNum,
                        type: item.type,
                        time: item.time,
                        title: item.title,
                        url: item.url,
                        desc: item.desc,
                        subPlaces: item.subPlaces || []
                    })
                });
            } catch(error) {
                console.error("行程同步失敗:", error);
            }
        }

        function handleAddItem(e) {
            e.preventDefault();
            const dayNum = parseInt(document.getElementById('inputDay').value);
            const type = document.getElementById('inputType').value;
            const time = document.getElementById('inputTime').value;
            const title = document.getElementById('inputLocation').value;
            const url = document.getElementById('inputUrl').value.trim();
            const desc = document.getElementById('inputDesc').value;

            const target = appData.days.find(d => d.day === dayNum);
            const newItem = {
                id: Date.now(),
                type,
                time,
                title,
                url,
                desc,
                subPlaces: []
            };

            if(target) {
                target.items.push(newItem);
                target.items.sort((a, b) => {
                    const timeA = a.time.split(":").map(Number);
                    const timeB = b.time.split(":").map(Number);
                    return (timeA[0] * 60 + timeA[1]) - (timeB[0] * 60 + timeB[1]);
                });
                saveAppData();
                addItineraryToSheet(newItem, dayNum);
            }
           
            closeModal('addModal');
            appData.activeDay = dayNum;
            switchTab('itinerary');
        }

            if(itemIndex > -1) {
                const [item] = oldDay.items.splice(itemIndex, 1);
                item.type = type; item.time = time; item.title = title; item.url = url; item.desc = desc;
                const newDay = appData.days.find(d => d.day === newDayNum);
                newDay.items.push(item);
                updateItineraryToSheet(item, newDayNum);
            }

            saveAppData();
            closeModal('editModal');
            appData.activeDay = newDayNum;
            switchTab('itinerary');
        }

        async function updateItineraryToSheet(item, dayNum) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "updateItinerary",
                        id: item.id,
                        day: dayNum,
                        type: item.type,
                        time: item.time,
                        title: item.title,
                        url: item.url,
                        desc: item.desc,
                        subPlaces: item.subPlaces || []
                    })
                });
            } catch(error) {
                console.error("行程更新同步失敗:", error);
            }
        }

        async function deleteCurrentItem() {
            if(confirm('確定要刪除這個行程項目嗎？')) {
                const day = appData.days.find(d => d.day === editingItineraryContext.dayNum);
                const item = day.items.find(i => i.id === editingItineraryContext.itemId);
                if(item) {
                    try {
                        await fetch(API_URL, {
                            method: "POST",
                            body: JSON.stringify({
                                action: "deleteItinerary",
                                id: item.id
                            })
                        });
                    } catch(error) {
                        console.error("行程刪除同步失敗:", error);
                    }
                }
                day.items = day.items.filter(i => i.id !== editingItineraryContext.itemId);
                saveAppData();
                closeModal('editModal');
                switchTab('itinerary');
            }
        }

        function toggleSelectAll(checkboxName) {
            const checkboxes = document.querySelectorAll(`input[name="${checkboxName}"]`);
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        async function handleAddExpense(e) {
            e.preventDefault();
            const date = document.getElementById('expDate').value;
            const item = document.getElementById('expItemName').value;
            const currency = document.getElementById('expCurrency').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const payer = document.getElementById('expPayer').value;
            const members = Array.from(document.querySelectorAll('input[name="splitMember"]:checked')).map(cb => cb.value);

            if(!item || isNaN(amount) || members.length === 0) {
                alert('請完整填寫項目,金額並至少選擇一位分攤成員！');
                return;
            }

            let repayments = {};
            members.forEach(m => { if(m !== payer) repayments[m] = false; });

            const expense = {
                id: Date.now(),
                date,
                item,
                currency,
                amount,
                payer,
                members,
                repayments
            };

            appData.expenses.push(expense);
            saveAppData();
            await addExpenseToSheet(expense);
            closeModal('expenseModal');
            document.getElementById('expenseForm').reset();
            render();
        }

        function openExpenseDetail(expenseId) {
            const ex = appData.expenses.find(e => e.id === expenseId);
            if(!ex) return;
            document.getElementById('detailTitle').innerText = `帳單詳情：${ex.item}`;
            const members = ex.members || ['彩庭', '溫芯', '俞萱', '浤緯'];
            const share = ex.amount / members.length;

            let html = `
                <div class="bg-[#F3F1EA] p-3 border border-[#E5E2D9] space-y-1 mb-3">
                    <div class="flex justify-between"><span>日期：</span><strong>${ex.date || '未填寫'}</strong></div>
                    <div class="flex justify-between"><span>付款人：</span><strong>${ex.payer}</strong></div>
                    <div class="flex justify-between"><span>總金額：</span><strong>${ex.currency} ${ex.amount.toLocaleString()}</strong></div>
                </div>
                <div class="font-bold text-[#2D2B28] mb-2">還款成員狀況 (點擊切換狀態)：</div>
                <div class="space-y-1.5">
            `;

            members.forEach(m => {
                if(m === ex.payer) return;
                const isPaid = !!(ex.repayments && ex.repayments[m]);
                html += `
                    <div onclick="toggleRepayment(${ex.id}, '${m}')" class="bg-[#F3F1EA] p-2.5 border border-[#E5E2D9] flex justify-between items-center cursor-pointer">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" ${isPaid ? 'checked' : ''} class="accent-[#2D2B28] pointer-events-none">
                            <span class="${isPaid ? 'line-through text-[#8A867D]' : 'text-[#2D2B28]'}">${m}</span>
                        </div>
                        <span class="${isPaid ? 'text-emerald-600' : 'text-amber-600'}">${isPaid ? '已還款' : '未還款'}</span>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('detailContent').innerHTML = html;
            openModal('expenseDetailModal');
        }

        async function toggleRepayment(expenseId, memberName) {
            const ex = appData.expenses.find(e => e.id === expenseId);
            if(ex && ex.repayments) {
                ex.repayments[memberName] = !ex.repayments[memberName];
                saveAppData();
                try {
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "updateRepayment",
                            id: ex.id,
                            repayments: ex.repayments
                        })
                    });
                } catch(error) {
                    console.error("同步還款失敗:", error);
                }
                openExpenseDetail(expenseId);
                render();
            }
        }

        function openEditExpenseModal(expenseId) {
            const ex = appData.expenses.find(e => e.id === expenseId);
            if(!ex) return;

            document.getElementById('editExpId').value = ex.id;
            document.getElementById('editExpDate').value = ex.date || '';
            document.getElementById('editExpItemName').value = ex.item || '';
            document.getElementById('editExpCurrency').value = ex.currency || 'JPY';
            document.getElementById('editExpAmount').value = ex.amount || '';
            document.getElementById('editExpPayer').value = ex.payer || '彩庭';

            const checkboxes = document.querySelectorAll('input[name="editSplitMember"]');
            checkboxes.forEach(cb => {
                cb.checked = ex.members && ex.members.includes(cb.value);
            });

            openModal('editExpenseModal');
        }

        async function updateExpenseToSheet(expense) {
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "updateExpense",
                    id: expense.id,
                    date: expense.date,
                    item: expense.item,
                    currency: expense.currency,
                    amount: expense.amount,
                    payer: expense.payer,
                    members: expense.members,
                    repayments: expense.repayments
                })
            });
        }

        async function handleUpdateExpense(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editExpId').value);
            const date = document.getElementById('editExpDate').value;
            const item = document.getElementById('editExpItemName').value;
            const currency = document.getElementById('editExpCurrency').value;
            const amount = parseFloat(document.getElementById('editExpAmount').value);
            const payer = document.getElementById('editExpPayer').value;

            const memberCheckboxes = document.querySelectorAll('input[name="editSplitMember"]:checked');
            const members = Array.from(memberCheckboxes).map(cb => cb.value);

            if(!item || isNaN(amount) || members.length === 0) {
                alert('請完整填寫項目,金額並至少選擇一位分攤成員！');
                return;
            }

            const ex = appData.expenses.find(e => e.id === id);
            if(ex) {
                ex.date = date;
                ex.item = item;
                ex.currency = currency;
                ex.amount = amount;
                ex.payer = payer;
                ex.members = members;

                if(!ex.repayments) ex.repayments = {};
                members.forEach(m => {
                    if(m !== payer && ex.repayments[m] === undefined) {
                        ex.repayments[m] = false;
                    }
                });
            }

            saveAppData();
            await updateExpenseToSheet(ex);
            closeModal('editExpenseModal');
            render();
        }

        async function deleteCurrentExpense() {
            if(confirm('確定要刪除這個支出項目嗎？')) {
                const id = parseInt(document.getElementById('editExpId').value);
                appData.expenses = appData.expenses.filter(e => e.id !== id);
                saveAppData();
                try {
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "deleteExpense",
                            id: id
                        })
                    });
                } catch(error) {
                    console.error("同步刪除失敗:", error);
                }
                closeModal('editExpenseModal');
                render();
            }
        }

        function deleteExpense(id) {
            appData.expenses = appData.expenses.filter(e => e.id !== id);
            saveAppData();
            render();
        }

        const today = new Date();
        const expDateEl = document.getElementById('expDate');
        if(expDateEl) {
            expDateEl.value = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
        }

        fetchLatestExchangeRate();
        loadExpensesFromSheet();
        loadItineraryFromSheet();
        loadHotelNearbyFromSheet();

        render();
    </script>
</body>
</html>
